[project]
name = "qa-toolkit"
version = "0.1.0"
description = "Sistema unificado de herramientas de QA (Azure DevOps) con interfaz Tkinter"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "requests>=2.31", "openpyxl>=3.1", "python-dotenv>=1.0", "truststore>=0.9",
]

[project.scripts]
qa-toolkit = "qa_toolkit.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # el formateador ya controla el largo; los textos de UI pueden excederlo
